name: Render video

on:
  workflow_dispatch:        # tombol "Run workflow" di tab Actions
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', '.github/workflows/render.yml']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 libgbm1

      - name: Install dependencies
        run: npm install

      - name: Validate (tidak menghentikan render)
        continue-on-error: true
        run: |
          npm run scan-assets
          npm run validate

      - name: Render MP4
        run: npm run render

      - name: Cek hasil render
        run: |
          ls -lh out/
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of default=nw=1 out/trading-intro.mp4 || true

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: trading-intro-mp4
          path: out/trading-intro.mp4
          retention-days: 30
          if-no-files-found: error
